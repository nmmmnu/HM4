- id:          VSIMLSH
  name:        VSIMLSH
  usage:       VSIMLSH key dim_ix quantize_type distance_type name number_of_bands number_of_bits
  params:
    items:
    - k: key
      v: name of the index object
    - k: dim_ix
      v: dimention of the index.
    - k: quantize_type
      v: quantization, see the table below
    - k: distance_type
      v: type of the distance, see the table below
    - k: name
      v: vector name
    - k: number_of_bands
      v: how many bands to be searched - 1 to 256. The index is created with 256 bands,
         the more bands - the better results, but search is slower.
    - k: number_of_bits
      v: how many bits per band to be searched - 12 to 16. The index is created with 16 bits,
         the less bits - the better results, but search is slower.

  return_type: array
  return:      list of 32 keys / scores
  version:     1.4.0
  complexity:  slow &rarr; (1 + BANDS * 1000) * READ
  mutable:     false
  compatible:  false
  description: |
    <p>Search the index *key* using LSH method for *name*.</p>
    <p>The vector you search must be in the index.</p>

    Quantization types:
    <table border="1" class="x">
      <tr>
        <th>Flag</th>
        <th>Quantization</th>
        <th>Storage Type</th>
        <th>Bytes</th>
        <th>Notes</th>
        <th>Precision loss</th>
        <th>Disk size of GloVe set</th>
      </tr>
      <tr>
        <td align="center">F</td>
        <td>None</td>
        <td>float</td>
        <td align="right">4</td>
        <td>No quantization - store values exactly as 32-bit floats</td>
        <td align="right">0.00 %</td>
        <td align="right">1,232 MB</td>
      </tr>
      <tr>
        <td align="center">S</td>
        <td>Q15</td>
        <td>int16_t</td>
        <td align="right">2</td>
        <td>50% space reduction - near-lossless precision</td>
        <td align="right">~0.01 %</td>
        <td align="right">660 MB</td>
      </tr>
      <tr>
        <td align="center">I</td>
        <td>Q7</td>
        <td>int8_t</td>
        <td align="right">1</td>
        <td>75% space reduction - precision good for most workloads</td>
        <td align="right">~1.00 %</td>
        <td align="right">374 MB
      </td>
      </tr>
      <tr>
        <td align="center">B</td>
        <td>bit</td>
        <td>bit</td>
        <td align="right">1/8</td>
        <td>97% space reduction - precision probably is lost</td>
        <td align="right">~~~5.00 %</td>
        <td align="right">124 MB</td>
      </tr>
    </table>

    Distance types:
    <table border="1" class="x">
      <tr>
        <th>Flag</th>
        <th>Metric Name</th>
        <th>Range</th>
        <th>Bit</th>
        <th>Description</th>
      </tr>
      <tr>
        <td align="center">E</td>
        <td>Euclidean (L2)</td>
        <td align="center">0 .. &infin;</td>
        <td>&nbsp;</td>
        <td>Standard straight-line distance between two points in Euclidean space.</td>
      </tr>
      <tr>
        <td align="center">M</td>
        <td>Manhattan (L1)</td>
        <td align="center">0 .. &infin;</td>
        <td>&nbsp;</td>
        <td>Sum of absolute differences across dimensions. Also known as "taxicab" or "city-block" distance.</td>
      </tr>
      <tr>
        <td align="center">C</td>
        <td>Cosine</td>
        <td align="center">0 .. 1</td>
        <td>&nbsp;</td>
        <td>Measures the cosine of the angle between two vectors (orientation, not magnitude).</td>
      </tr>
      <tr>
        <td align="center">K</td>
        <td>Canberra</td>
        <td align="center">0 .. &infin;</td>
        <td>&nbsp;</td>
        <td>A weighted version of L1 where each component is normalized by its sum. Useful when components vary greatly in scale.</td>
      </tr>
      <tr>
        <td align="center">B</td>
        <td>Bit cosine	</td>
        <td align="center">0 .. 1</td>
        <td align="center">Yes</td>
        <td>Works only on bit quantized vectors. Cosine distance for bit vectors.</td>
      </tr>
      <tr>
        <td align="center">H</td>
        <td>Hamming</td>
        <td align="center">0 .. 1</td>
        <td align="center">Yes</td>
        <td>Works only on bit quantized vectors.</td>
      </tr>
      <tr>
        <td align="center">D</td>
        <td>Dominating</td>
        <td align="center">0 .. 1</td>
        <td align="center">Yes</td>
        <td>Works only on bit quantized vectors. This is not distance, but checks if the result vector contains query vector.</td>
      </tr>
    </table>

    Vector types:
    <table border="1" class="x">
      <tr>
        <th>Flag</th>
        <th>Output</th>
        <th>Byte Order</th>
      </tr>
      <tr>
        <td align="center">H</td>
        <td>hexadecimal</td>
        <td>big-endian</td>
      </tr>
      <tr>
        <td align="center">h</td>
        <td>hexadecimal</td>
        <td>little-endian</td>
      </tr>
      <tr>
        <td align="center">B</td>
        <td>binary</td>
        <td>big-endian</td>
      </tr>
      <tr>
        <td align="center">b</td>
        <td>binary</td>
        <td>little-endian</td>
      </tr>
    </table>

