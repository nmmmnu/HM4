- id:       VEXISTS
  name:     VEXISTS
  usage:    VEXISTS key sub_key
  params:
    items:
    - k: key
      v: name of the index object
    - k: sub_key
      v: sub_key

  return_type: bool
  return:      value
  version:     1.4.0
  complexity:  READ
  mutable:     false
  compatible:  false
  description: |
    <p>Check existance of *sub_key* from index object *key*</p>

  example:     |
    127.0.0.1:6379> vexists a 001
    (integer) 1
    127.0.0.1:6379> vmexists a 001 005 002
    1) "1"
    2) "0"
    3) "1"

  see_also:
    items:
      - VMEXISTS

