- id:          IXMSIM1
  name:        IXMSIM1
  usage:       IXMSIM1 key word count start
  params:
    items:
    - k: key
      v: name of the mindex object
    - k: word
      v: single word
    - k: count
      v: result count
    - k: start
      v: specify starting key (for pagination in the similar way as in XNGET)

  description: |
    Returns a range mindex object *key* using single *word*

  return_type: array
  return:      list of key / values with "next" key at the end.
  version:     1.4.0
  complexity:  READ
  mutable:     false
  compatible:  false
  example:     |
    127.0.0.1:6379> IXMADD news 1000 '' , "George,Bush,spokes,in,the,senate"
    (integer) 1
    127.0.0.1:6379> IXMADD news 1001 '' , "New,laptop,from,DELL"
    (integer) 1
    127.0.0.1:6379> IXMADD news 1002 '' , "George,Bush,visits,France"
    (integer) 1
    127.0.0.1:6379> IXMADD news 1003 '' , "Cold,weath,soon"
    (integer) 1
    127.0.0.1:6379> IXMADD news 1003 '' , "Cold,weather,soon"
    (integer) 1
    127.0.0.1:6379> IXMADD news 1004 '' , "George,Michael,had,a,concert,with,Kate,Bush"
    (integer) 1
    127.0.0.1:6379> IXMADD news 1005 '' , "Why,you,should,read,1984,from,George,Orwell"
    (integer) 1
    127.0.0.1:6379> IXMSIM1 news "George" 20 ''
    1) "1002"
    2) "1"
    3) "1000"
    4) "1"
    5) "1004"
    6) "1"
    7) "1005"
    8) "1"
    9) ""


