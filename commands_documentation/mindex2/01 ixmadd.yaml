- id:          IXMADD
  name:        IXMADD
  usage:       IXMADD key key_sub sort_key delimiter "words,words"
  params:
    items:
    - k: key
      v: name of the mindex object
    - k: key_sub
      v: sub key
    - k: sort_key
      v: influences the sorting of the results of IXMRANGE* commands
    - k: delimiter
      v: delimiter, for example "," (coma)
    - k: "words,words"
      v: words

  description: |
    Insert *words,words* separated by *delimiter* into the mindex object *key*, with *sub_key* and *sort_key*

  return_type: bool
  return:      always returns 1
  version:     1.4.0
  complexity:  READ + 2 * (N + 1) * WRITE
  mutable:     true
  compatible:  false
  example:     |
    127.0.0.1:6379> IXMADD news 1000 '' , "George,Bush,spokes,in,the,senate"
    (integer) 1
    127.0.0.1:6379> IXMADD news 1001 '' , "New,laptop,from,DELL"
    (integer) 1

