- id:          IXMREM
  name:        IXMREM
  usage:       IXMREM key sub_key
  params:
    items:
    - k: key
      v: name of the mindex object
    - k: key_sub
      v: sub key

  description: |
    Remove *sub_key* from mindex object *key*

  return_type: bool
  return:      always returns 1
  version:     1.4.0
  complexity:  READ + (N + 1) * WRITE
  mutable:     true
  compatible:  false
  example:     |
    127.0.0.1:6379> IXMADD news 1000 '' , "George,Bush,spokes,in,the,senate"
    (integer) 1
    127.0.0.1:6379> IXMADD news 1001 '' , "New,laptop,from,DELL"
    (integer) 1
    127.0.0.1:6379> ixmrem news 1000 1001
    (integer) 1

