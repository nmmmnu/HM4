- id:          IXMSIM
  name:        IXMSIM
  usage:       IXMSIM key delimiter "words,words" count start
  params:
    items:
    - k: key
      v: name of the mindex object
    - k: delimiter
      v: delimiter, for example "," (coma)
    - k: words,words
      v: words - up to 32 words
    - k: count
      v: result count
    - k: start
      v: specify starting key (for pagination in the similar way as in XNGET)
  aliases:
    items:
      - IXMRANGE

  description: |
    Returns a range mindex object *key* using words *words,words*<br />
    The results apears, if contains ALL of the words.

  return_type: array
  return:      list of key / values with "next" key at the end.
  version:     1.4.0
  complexity:  "[number of words] * READ"
  mutable:     false
  compatible:  false
  example:     |
    127.0.0.1:6379> # add data. "TAG:*" are normal words, but we pass them separately, because is easy for the client.
    OK
    127.0.0.1:6379> IXMADD news 1000 '' , "TAG:politics,TAG:us"        , "George,Bush,spokes,in,the,senate"
    (integer) 1
    127.0.0.1:6379> IXMADD news 1001 '' , "TAG:tech"                   , "New,laptop,from,DELL"
    (integer) 1
    127.0.0.1:6379> IXMADD news 1002 '' , "TAG:politics,TAG:us,TAG:eu" , "George,Bush,visits,France"
    (integer) 1
    127.0.0.1:6379> IXMADD news 1003 '' , "TAG:weather,TAG:us"         , "Cold,weath,soon"
    (integer) 1
    127.0.0.1:6379> IXMADD news 1003 '' , "TAG:weather,TAG:us"         , "Cold,weather,soon"
    (integer) 1
    127.0.0.1:6379> IXMADD news 1004 '' , "TAG:culture,TAG:eu"         , "George,Michael,had,a,concert,with,Kate,Bush,in,EU"
    (integer) 1
    127.0.0.1:6379> IXMADD news 1005 '' , "TAG:culture"                , "Why,you,should,read,1984,from,George,Orwell"
    (integer) 1

    127.0.0.1:6379> # search for George Bush. It will "catch" the concert news too
    OK
    127.0.0.1:6379> IXMSIM news , "George,Bush" 20 ''
    1) "1002"
    2) "1"
    3) "1000"
    4) "1"
    5) "1004"
    6) "1"
    7) ""

    127.0.0.1:6379> # search for TAG:us + George Bush. "TAG:us" is normal word, but we pass it separately, because is easy for the backend.
    OK
    127.0.0.1:6379> IXMSIM news , "TAG:us" , "George,Bush" 20 ''
    1) "1002"
    2) "1"
    3) "1000"
    4) "1"
    7) ""

    127.0.0.1:6379> # search for George Bush + TAG:us. It is bad idea to add the special tokens such tags at the end,
    OK
    127.0.0.1:6379> # because if the first query may come from the user and it may contains 32 or more characters. Then the tags will be ignored.
    OK
    127.0.0.1:6379> IXMSIM news , "George,Bush" , "TAG:us" 20 ''
    1) "1002"
    2) "1"
    3) "1000"
    4) "1"
    7) ""

    127.0.0.1:6379> # We can separate all search words to be separate...
    OK
    127.0.0.1:6379> IXMSIM news , "TAG:us" , "George" , "Bush" 20 ''
    1) "1002"
    2) "1"
    3) "1000"
    4) "1"

    127.0.0.1:6379> # ...or we can combine them all...
    OK
    127.0.0.1:6379> IXMSIM news , "TAG:us,George,Bush" 20 ''
    1) "1002"
    2) "1"
    3) "1000"
    4) "1"
    5) ""
