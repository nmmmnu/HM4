- id:          MHMJACCARD
  name:        MHMJACCARD
  usage:       MHMJACCARD key bands keySub keySub2 [keySub3 ...]
  params:
    items:
    - k: key
      v: name of the MinHash index space
    - k: bands
      v: size/partitioning factor for LSH bands
    - k: keySub
      v: primary document identifier / subkey
    - k: keySub2
      v: target document identifier / subkey to compare against
  return_type: array
  return:      returns an array containing target subkeys paired with their Jaccard similarity scores
  version:     1.3.15.1
  complexity:  N * READ
  mutable:     false
  compatible:  false
  description: |
    <p>Calculates the exact <b>Jaccard Similarity</b> coefficient between a primary document (<i>keySub</i>) and multiple target documents in a single call.</p>
    <p>J(A, B) = |A &cap; B| / |A &cup; B|)</p>
    <p>Minimizes network round-trips by batching 1:N pairwise MinHash signature comparisons.</p>
  example:     |
    127.0.0.1:6379> mhadd articles:i 16 doc:1001 , "apple,iphone,technology" doc:1002 , "apple,iphone,mobile"
    (integer) 1
    127.0.0.1:6379> mhmjaccard articles:i 16 doc:1001 doc:1002 doc:1003
    1) "+0.5000000000"
    2) "0"
  see_also:
    items:
      - MHJACCARD
      - MHOVERLAP
      - MHMOVERLAP
      - PFJACCARD
      - PFMJACCARD
      - PFOVERLAP
      - PFMOVERLAP

