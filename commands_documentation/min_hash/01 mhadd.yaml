- id:          MHADD
  name:        MHADD
  usage:       MHADD key bands keySub delimiter tokens [keySub2 delimiter tokens2 ...]
  params:
    items:
    - k: key
      v: name of the MinHash index space
    - k: bands
      v: size/partitioning factor for LSH bands
    - k: keySub
      v: unique document identifier / subkey
    - k: delimiter
      v: single-character token separator (e.g. ",")
    - k: tokens
      v: delimited string of text tokens or shingle words
  return_type: integer
  return:      always 1
  version:     1.3.15.1
  complexity:  N * (READ + (1 + BANDS * 2) * WRITE)
  mutable:     true
  compatible:  false
  description: |
    <p>Generates a fixed <b>4096-hash MinHash signature</b> from the provided text tokens and inserts the document under <i>keySub</i> into the LSH index space.</p>
    <p>The signature is split into LSH buckets according to the <i>bands</i> parameter and written alongside the subkey signature metadata,
    enabling fast candidate lookup during similarity searches.</p>
    <p>Supports batching multiple <code>keySub delimiter tokens</code> sets in a single invocation for maximum throughput.</p>
  example:     |
    127.0.0.1:6379> mhadd articles:i 16 doc:1001 , "apple,iphone,technology" doc:1002 , "apple,iphone,mobile"
    (integer) 1
