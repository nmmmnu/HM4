- id:          MHJACCARD
  name:        MHJACCARD
  usage:       MHJACCARD key bands keySub keySub2
  params:
    items:
    - k: key
      v: name of the MinHash index space
    - k: bands
      v: size/partitioning factor for LSH bands
    - k: keySub
      v: primary document identifier / subkey
    - k: keySub2
      v: target document identifier / subkey to compare against
  return_type: string (float)
  return:      returns the exact Jaccard similarity score formatted as a floating-point string
  version:     1.3.15.1
  complexity:  2 * READ
  mutable:     false
  compatible:  false
  description: |
    <p>Calculates the exact <b>Jaccard Similarity</b> coefficient between two stored document signatures (<i>keySub</i> and <i>keySub2</i>) using their MinHash arrays.</p>
    <p>J(A, B) = |A &cap; B| / |A &cup; B|)</p>
    <p>The resulting score ranges from <code>0.0</code> (completely distinct) to <code>1.0</code> (identical signatures).</p>
  example:     |
    127.0.0.1:6379> mhadd articles:i 16 doc:1001 , "apple,iphone,technology" doc:1002 , "apple,iphone,mobile"
    (integer) 1
    127.0.0.1:6379> mhjaccard articles:i 16 doc:1001 doc:1002
    "+0.5000000000"
  see_also:
    items:
      - MHMJACCARD
      - MHOVERLAP
      - MHMOVERLAP
      - PFJACCARD
      - PFMJACCARD
      - PFOVERLAP
      - PFMOVERLAP

