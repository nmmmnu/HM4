- id:          MHOVERLAP
  name:        MHOVERLAP
  usage:       MHOVERLAP key bands keySub keySub2
  params:
    items:
    - k: key
      v: name of the MinHash index space
    - k: bands
      v: size/partitioning factor for LSH bands
    - k: keySub
      v: primary document identifier / subkey
    - k: keySub2
      v: target document identifier / subkey to compare against
  return_type: string (float)
  return:      returns the exact Overlap coefficient formatted as a floating-point string
  version:     1.3.15.1
  complexity:  2 * READ
  mutable:     false
  compatible:  false
  description: |
    <p>Calculates the <b>Szymkiewicz–Simpson Overlap Coefficient</b> between two stored document signatures (<i>keySub</i> and <i>keySub2</i>).</p>
    <p>Overlap(A, B) = |A &cap; B| / min(|A|, |B|)</p>
    <p>Unlike Jaccard similarity, Overlap evaluates set intersection relative to the size of the smaller document, making it ideal for detecting short quotes, citations, or summary containment inside longer articles.</p>
  example:     |
    127.0.0.1:6379> mhadd articles:i 16 doc:1001 , "apple,iphone,technology" doc:1002 , "apple,iphone,mobile"
    (integer) 1
    127.0.0.1:6379> mhoverlap articles:i 16 doc:1001 doc:1002
    "+0.6666666667"
  see_also:
    items:
      - MHJACCARD
      - MHMJACCARD
      - MHMOVERLAP
      - PFJACCARD
      - PFMJACCARD
      - PFOVERLAP
      - PFMOVERLAP


