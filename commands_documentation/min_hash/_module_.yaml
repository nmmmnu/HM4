id:          MINHASH
name:        MINHASH

version:     1.3.15.1

description: |
  <p>This module implements a <b>high-performance MinHash & Locality-Sensitive Hashing (LSH) engine</b> - a space-efficient data structure
  designed for ultra-fast <b>near-duplicate detection</b>, document similarity estimation, and real-time text deduplication.</p>

  <p><b>Core Architecture & Fixed Specifications:</b></p>
  <ul>
    <li><b>Fixed Signature Size:</b> The MinHash signature length is fixed at <b>4096 hashes</b> per document (12 bits). Each hash element is stored as a 16-bit integer.</li>
    <li><b>Stateless & Flexible LSH Banding:</b> LSH index partitioning is dynamically controlled via the <code>bands</code> parameter provided during command execution,
    eliminating the need for complex persistent index state configuration.</li>
    <li><b>Zero-Allocation Read-Only Ad-hoc Queries:</b> Supports evaluating both pre-indexed document keys and raw, unindexed text streams entirely in RAM without modifying
    disk or triggering database writes.</li>
  </ul>

  <p><b>What It Does:</b></p>

  <p><b>1. Fast Subkey Indexing & Bucket Distribution</b></p>
  <p>Via <b>MHADD</b>, text tokens are converted into a 4096-element MinHash signature, segmented into <code>bands</code> LSH buckets, and indexed under specified subkeys.</p>

  <p><b>2. Subkey & Ad-hoc Text Similarity Search</b></p>
  <p><b>MHSIM</b> performs candidate retrieval via LSH bucket matching followed by exact similarity ranking.
  It works seamlessly for both existing <code>keySub</code> targets and on-the-fly token inputs.</p>

  <p><b>3. Exact Pairwise & Multi-Key Distance Metrics</b></p>
  <p>Provides exact score evaluations directly against 4096-hash MinHash signatures:
  <ul>
    <li><b>MHJACCARD</b> / <b>MHMJACCARD</b>: Calculates standard Jaccard Similarity (1:1 or 1:N pairwise batch against the first subkey).</li>
    <li><b>MHOVERLAP</b> / <b>MHMOVERLAP</b>: Calculates Szymkiewicz–Simpson Overlap Coefficient (1:1 or 1:N pairwise batch, ideal for containment and quote matching).</li>
  </ul>
  </p>

  <p><b>4. Inspection & Maintenance</b></p>
  <p>Use <b>MHGETINDEXES</b> to inspect calculated LSH band bucket hashes, <b>MHREM</b> to purge subkeys from both LSH buckets and document storage and
  <b>MHBITS</b> to query module configuration parameters.</p>

  <p><b>Use Cases:</b></p>
  <ul>
    <li>Real-time news article plagiarism and duplicate clustering</li>
    <li>Content recommendation systems ("More on this topic") - however it does not work very well for this.</li>
    <li>Web crawler deduplication before indexing</li>
    <li>Large-scale log and text message stream canonicalization</li>
  </ul>

example_module:     |
  127.0.0.1:6379> mhbits
  (integer) 12
  127.0.0.1:6379> mhadd articles:i 16 doc:1001 , "apple,iphone,technology,news" doc:1002 , "apple,iphone,mobile,news" doc:1003 , "football,sports,stadium"
  (integer) 1
  127.0.0.1:6379> mhgetindexes articles:i 16 doc:1001
  1) "D7E162CCF730779D.0031"
  2) "38E520B28743100B.0121"
  3) "D902CFEEB62FA943.0143"
  4) "E2C16FFA0DCCE287.01FD"
  127.0.0.1:6379> mhsim articles:i 16 doc:1001
  1) "doc:1002"
  2) "+0.6000000000"
  127.0.0.1:6379> mhsim articles:i 16 , "apple,iphone,technology,gadgets"
  1) "doc:1001"
  2) "+0.6000000000"
  3) "doc:1002"
  4) "+0.3333333333"
  127.0.0.1:6379> mhjaccard articles:i 16 doc:1001 doc:1002
  "+0.6000000000"
  127.0.0.1:6379> mhmjaccard articles:i 16 doc:1001 doc:1002 doc:1003
  1) "+0.6000000000"
  2) "+0.0000000000"
  127.0.0.1:6379> mhoverlap articles:i 16 doc:1001 doc:1002
  "+0.7500000000"
  127.0.0.1:6379> mhmoverlap articles:i 16 doc:1001 doc:1002 doc:1003
  2) "+0.7500000000"
  4) "+0.0000000000"
  127.0.0.1:6379> mhrem articles:i 16 doc:1003
  (integer) 1

