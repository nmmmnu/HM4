- id:       MHMEXISTS
  name:     MHMEXISTS
  usage:    MHMEXISTS key sub_key...
  params:
    items:
    - k: key
      v: name of the index object
    - k: sub_key
      v: sub_key

  return_type: arrau
  return:      values
  version:     1.4.0
  complexity:  N * READ
  mutable:     false
  compatible:  false
  description: |
    <p>Check existance of several *sub_key* from index object *key*</p>

  example:     |
    127.0.0.1:6379> mhexists a 001
    (integer) 1
    127.0.0.1:6379> mhmexists a 001 005 002
    1) "1"
    2) "0"
    3) "1"

  see_also:
    items:
      - MHEXISTS

