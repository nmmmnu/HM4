- id:          MHREM
  name:        MHREM
  usage:       MHREM key bands keySub [keySub2 ...]
  params:
    items:
    - k: key
      v: name of the MinHash index space
    - k: bands
      v: size/partitioning factor for LSH bands
    - k: keySub
      v: unique document identifier / subkey to remove
  return_type: integer
  return:      always return 1
  version:     1.3.15.1
  complexity:  N * (READ + (1 + BANDS * 2) * WRITE)
  mutable:     true
  compatible:  false
  description: |
    <p>Removes one or more documents specified by <i>keySub</i> from the MinHash index space.</p>
    <p>The command reads the stored MinHash signature for each <i>keySub</i>, cleans up all associated LSH bucket entries generated by the specified <i>bands</i> parameter and
    reclaims the underlying document metadata memory.</p>
    <p>Supports removing multiple subkeys in a single call for batch cleanup.</p>
  example:     |
    127.0.0.1:6379> mhadd articles:i 16 doc:1001 , "apple,iphone,technology" doc:1002 , "apple,iphone,mobile"
    (integer) 1
    127.0.0.1:6379> mhrem articles:i 16 doc:1001 doc:1002
    (integer) 1
