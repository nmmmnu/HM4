- id:          MHMOVERLAP
  name:        MHMOVERLAP
  usage:       MHMOVERLAP key bands keySub keySub2 [keySub3 ...]
  params:
    items:
    - k: key
      v: name of the MinHash index space
    - k: bands
      v: size/partitioning factor for LSH bands
    - k: keySub
      v: primary document identifier / subkey
    - k: keySub2
      v: target document identifier / subkey to compare against
  return_type: array
  return:      returns an array containing target subkeys paired with their Overlap coefficients
  version:     1.3.15.1
  complexity:  N * READ
  mutable:     false
  compatible:  false
  description: |
    <p>Calculates the <b>Szymkiewicz–Simpson Overlap Coefficient</b> between a primary document (<i>keySub</i>) and multiple target documents in a single batch operation.</p>
    <p>Overlap(A, B) = |A &cap; B| / min(|A|, |B|)</p>
    <p>Allows efficient evaluation of text inclusion and containment across multiple targets simultaneously.</p>
  example:     |
    127.0.0.1:6379> mhadd articles:i 16 doc:1001 , "apple,iphone,technology" doc:1002 , "apple,iphone,mobile"
    (integer) 1
    127.0.0.1:6379> mhmoverlap articles:i 16 doc:1001 doc:1002 doc:1003
    1) "+0.6666666667"
    2) "0"
  see_also:
    items:
      - MHJACCARD
      - MHMJACCARD
      - MHOVERLAP
      - PFJACCARD
      - PFMJACCARD
      - PFOVERLAP
      - PFMOVERLAP

