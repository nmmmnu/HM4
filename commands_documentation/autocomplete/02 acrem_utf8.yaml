- id:       ACREM_UTF8
  name:     ACREM_UTF8
  aliases:
    items:
    - ACREM
  usage:    ACREM_UTF8 key text
  params:
    items:
    - k: key
      v: name of autocomplete object
    - k: text
      v: text, must be ASCII or UTF8

  description: |
    Remove *text* from the autocomplete object *key*.

  return_type: bool
  return:      always returns 1
  version:     1.3.14.2
  complexity:  READ + (N + 1) * WRITE
  mutable:     true
  compatible:  false
  example:     |
    127.0.0.1:6379> ACREM_UTF8 mykey "hello world"
    (integer) 1

  see_also:
    items:
      - ACREM_BIN
