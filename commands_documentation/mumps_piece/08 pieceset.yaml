- id:          PIECESET
  name:        PIECESET
  usage:       PIECESET key delimiter field_id val [field_id val ...]
  params:
    items:
    - k: key
      v: the key holding the fixed-width string
    - k: delimiter
      v: field delimiter
    - k: field_id
      v: the id (number) specific field name to update
    - k: val
      v: the new value for the field_id

  description: |
    Selectively updates one or more *field_id* within the piece object at the specified *key*.<br />
    The data is parsed using the provided delimiter. Trailing empty values are automatically stripped.

  return_type: integer
  return:      1
  version:     1.4.1
  complexity:  READ + WRITE
  mutable:     true
  compatible:  false
  example:     |
    127.0.0.1:6379> piecesetall a , 1 Niki BG
    (integer) 1
    127.0.0.1:6379> piecegetall a ,
    1) "1"
    2) "Niki"
    3) "BG"
    127.0.0.1:6379> pieceset a , 1 John
    (integer) 1
    127.0.0.1:6379> piecegetall a ,
    1) "1"
    2) "John"
    3) "BG"
    127.0.0.1:6379> set b ,,,a
    (integer) 1
    127.0.0.1:6379> piecegetall b ,
    1) ""
    2) ""
    3) ""
    4) "a"
    127.0.0.1:6379> pieceset b , 3 ''
    (integer) 1
    127.0.0.1:6379> piecegetall b ,
    (empty array)

