- id:          PIECEDEL
  name:        PIECEDEL
  usage:       PIECEDEL key delimiter field_id [field_id ...]
  params:
    items:
    - k: key
      v: the key holding the fixed-width string
    - k: delimiter
      v: field delimiter
    - k: field_id
      v: the id (number) specific field_id to clear

  description: |
    Selectively deletes one or more *field_id* within the piece object at the specified *key*.<br />
    The data is parsed using the provided delimiter. Trailing empty values are automatically stripped.

  return_type: integer
  return:      1
  version:     1.3.14.1
  complexity:  1.4.1
  mutable:     true
  compatible:  false
  example:     |
    127.0.0.1:6379> piecesetall a , 1 Niki BG
    (integer) 1
    127.0.0.1:6379> piecegetall a ,
    1) "1"
    2) "Niki"
    3) "BG"
    127.0.0.1:6379> piecedel a , 1
    (integer) 1
    127.0.0.1:6379> piecegetall a ,
    1) "1"
    2) ""
    3) "BG"
    127.0.0.1:6379> set b ,,,a
    (integer) 1
    127.0.0.1:6379> piecegetall b ,
    1) ""
    2) ""
    3) ""
    4) "a"
    127.0.0.1:6379> piecedel b , 3
    (integer) 1
    127.0.0.1:6379> piecegetall b ,
    (empty array)


