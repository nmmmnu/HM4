- id:          PIECESETALL
  name:        PIECESETALL
  usage:       PIECESETALL key delimiter val [val ...]
  params:
    items:
    - k: key
      v: the key holding the fixed-width string
    - k: delimiter
      v: field delimiter
    - k: val
      v: values for all field_id, provided sequentially in the schema order

  description: |
    Initializes or completely overwrites the piece object at the specified *key*.<br />
    The data is parsed using the provided delimiter. Trailing empty values are automatically stripped.

  return_type: integer
  return:      1
  version:     1.4.1
  complexity:  WRITE
  mutable:     true
  compatible:  false
  example:     |
    127.0.0.1:6379> piecesetall a , 1 Niki BG
    (integer) 1
    127.0.0.1:6379> piecegetall a ,
    1) "1"
    2) "Niki"
    3) "BG"
    127.0.0.1:6379> get a
    "1,Niki,BG"

