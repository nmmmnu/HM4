- id:          PIECEAPPEND
  name:        PIECEAPPEND
  usage:       PIECEAPPEND key delimiter val [val s...]
  params:
    items:
    - k: key
      v: the key holding the fixed-width string
    - k: delimiter
      v: field delimiter
    - k: val
      v: the new value for the field_id to be appended

  description: |
    Appends one or more values in the piece object at the specified *key*.<br />
    Empty values are permitted, but ignored<br />
    The data is parsed using the provided delimiter. Trailing empty values are automatically stripped.

  return_type: array
  return:      flat array of field names and their corresponding values (field1, value1, field2, value2, ...)
  version:     1.4.1
  complexity:  READ
  mutable:     false
  compatible:  false
  example:     |
    127.0.0.1:6379> piecesetall a , 1 Niki BG
    (integer) 1
    127.0.0.1:6379> piecegetall a ,
    1) "1"
    2) "Niki"
    3) "BG"
    127.0.0.1:6379> pieceappend a , Sofia
    (integer) 1
    127.0.0.1:6379> get a
    "1,Niki,BG,Sofia"
    127.0.0.1:6379> set b a,,,,,,,
    OK
    127.0.0.1:6379> pieceappend b , '' '' test1 ''
    (integer) 1
    127.0.0.1:6379> piecegetall b ,
    1) "a"
    2) "test1"

