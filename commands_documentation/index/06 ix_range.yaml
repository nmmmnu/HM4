- id:       IX*RANGE
  name:     IX*RANGE
  usage:    IX*RANGE key permutation filter... count start
  params:
    items:
    - k: key
      v: name of the index object
    - k: permutation
      v: how indexes are ordered for example for 1 dimentions - _ and A, for 2 dimentions - _, A, B, AB and BA, for 3 dimentions - _, A, B, C, AB, AC, BA, BC, CA, CB, ABC, ACB, BAC, BCA, CAB and CBA
    - k: count
      v: result count
    - k: start
      v: specify starting key (for pagination in the similar way as in XNGET)

  return_type: array
  return:      values
  version:     1.4.0
  complexity:  READ
  mutable:     false
  compatible:  false
  description: |
    <p>Get ordered and filtered data from index object *key*</p>

    <p>After version 1.4.0, you can use short permutations. For example for IX3RANGE, you can additionally use A, B, C, AB, AC, BA, BC, CA, CB.<br />
    The idea behind this feature is to use sort key for sorting.</p>

  example:     |
    127.0.0.1:6379> # Adds 3 employes (numbers) - 001 in sofia, 002 in london, 003 in sofia. x is sort key.
    OK
    127.0.0.1:6379> ix1add a 001 sofia x 002 london x 003 sofia x
    (integer) 1

    127.0.0.1:6379> # Get all employes (numbers), permutation _ (keySort)
    OK
    127.0.0.1:6379> # select * from employes
    OK
    127.0.0.1:6379> ix1range a _ '' 100 ''
    1) "001"
    2) "1"
    3) "002"
    4) "1"
    5) "003"
    6) "1"
    7) ""

    127.0.0.1:6379> # Get all employes (numbers), permutation A (city)
    OK
    127.0.0.1:6379> # select * from employes order by A
    OK
    127.0.0.1:6379> ix1range a A '' 100 ''
    1) "001"
    2) "1"
    3) "003"
    4) "1"
    5) "002"
    6) "1"
    7) ""

    127.0.0.1:6379> # Get all employes (numbers), where first index is equal to "sofia"
    OK
    127.0.0.1:6379> # select * from employes where A = 'sofia' order by A
    OK
    127.0.0.1:6379> ix1range a A sofia 100 ''
    1) "001"
    2) "1"
    3) "003"
    4) "1"
    5) ""

    127.0.0.1:6379> # Remove all indexes:
    OK
    127.0.0.1:6379> ix1rem a 001 002 003
    (integer) 1

    127.0.0.1:6379> # Adds 3 employes (numbers) - 001 in sofia,IT + 002 in london + IT , 003 in sofia + sales. x is sort key.
    OK
    127.0.0.1:6379> ix2add a 001 sofia it x 002 london it x 003 sofia sales x
    (integer) 1

    127.0.0.1:6379> # Get all employes (numbers), permutation _ (keySort)
    OK
    127.0.0.1:6379> # select * from employes
    OK
    127.0.0.1:6379> ix2range a _ '' '' 100 ''
    1) "001"
    2) "1"
    3) "002"
    4) "1"
    5) "003"
    6) "1"
    7) ""

    127.0.0.1:6379> # Get all employes (numbers), permutation AB (city, then department)
    OK
    127.0.0.1:6379> # select * from employes order by A, B
    OK
    127.0.0.1:6379> ix2range a AB '' '' 100 ''
    1) "001"
    2) "1"
    3) "003"
    4) "1"
    5) "002"
    6) "1"
    7) ""

    127.0.0.1:6379> # Get all employes (numbers), permutation A (city). In this case, the result is the same as AB.
    OK
    127.0.0.1:6379> # select * from employes order by A
    OK
    127.0.0.1:6379> ix2range a A '' '' 100 ''
    1) "001"
    2) "1"
    3) "003"
    4) "1"
    5) "002"
    6) "1"
    7) ""

    127.0.0.1:6379> # Get all employes (numbers), permutation BA (department, then city)
    OK
    127.0.0.1:6379> # select * from employes order by B, A
    OK
    127.0.0.1:6379> ix2range a BA '' '' 100 ''
    1) "001"
    2) "1"
    3) "002"
    4) "1"
    5) "003"
    6) "1"
    7) ""

    127.0.0.1:6379> # Get all employes (numbers), permutation B (department). In this case, the result is the same as BA.
    OK
    127.0.0.1:6379> # select * from employes order by B
    OK
    127.0.0.1:6379> ix2range a B '' '' 100 ''
    1) "001"
    2) "1"
    3) "002"
    4) "1"
    5) "003"
    6) "1"
    7) ""

    127.0.0.1:6379> # Get all employes (numbers), permutation BA (department, then city), filter "it", any city.
    OK
    127.0.0.1:6379> # select * from employes where B = 'it' order by B, A
    OK
    127.0.0.1:6379> ix2range a BA it '' 100 ''
    1) "001"
    2) "1"
    3) "002"
    4) "1"
    5) ""

    127.0.0.1:6379> # Get all employes (numbers), permutation BA (department, then city), filter "it" + "sofia"
    OK
    127.0.0.1:6379> # select * from employes where B = 'it' and A = 'sofia' order by B, A
    OK
    127.0.0.1:6379> ix2range a BA it sofia 100 ''
    1) "001"
    2) "1"
    3) ""

    127.0.0.1:6379> # Get all employes (numbers), permutation AB (city, then department), filter "sofia", any department.
    OK
    127.0.0.1:6379> # select * from employes where A = 'sofia' order by A, B
    OK
    127.0.0.1:6379> ix2range a AB sofia '' 100 ''
    1) "001"
    2) "1"
    3) "003"
    4) "1"
    5) ""

    127.0.0.1:6379> # Get all employes (numbers), permutation AB (city, then department), filter "sofia" + "it"
    OK
    127.0.0.1:6379> # select * from employes where A = 'sofia' and B = 'it' order by A, B
    OK
    127.0.0.1:6379> ix2range a AB sofia it 100 ''
    1) "001"
    2) "1"
    3) ""

    127.0.0.1:6379> # Remove all indexes:
    OK
    127.0.0.1:6379> ix1rem a 001 002 003
    (integer) 1


