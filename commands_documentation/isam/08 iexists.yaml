- id:          IEXISTS
  name:        IEXISTS

  usage:       IEXISTS schema key field
  params:
    items:
    - k: schema
      v: field definitions in format size:field_name,size:field_name,...
    - k: key
      v: the key holding the fixed-width string
    - k: field
      v: the specific field name to retrieve

  description: |
    Checking the existance for the value of the specified *field* from the isam object stored in *key*.<br />
    The data is parsed using the provided schema.

  return_type: int
  return:      0/1 value corresponding to the requested field
  version:     1.4.1
  complexity:  READ
  mutable:     false
  compatible:  false
  example:     |
    127.0.0.1:6379> isetall 3:id,10:name,2:country a 1 Niki BG
    (integer) 1
    127.0.0.1:6379> iexists 3:id,10:name,2:country a name
    (integer) 1
    127.0.0.1:6379> iexists 3:id,10:name,2:country a nonexistent
    (integer) 0

  see_also:
      items:
        - IMEXISTS
