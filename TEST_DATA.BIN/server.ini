server_id			= 15
;server_id			= 0

immutable			= 0				; Start mutable = 0, immutable = 1, single = 2
db_path				= TEST_DATA.BIN/data.*.db	; Path to database

;binlog_path1			= TEST_DATA.BIN/.log.1.db	; Path to binlog, empty for none
;binlog_path2			= TEST_DATA.BIN/.log.2.db	; Path to binlog, empty for none
;binlog_fsync			= 0				; fsync() binlog

;host				= localhost			; TCP host to listen, not working yet
port				= 6379				; TCP port to listen
;port				= 6381				; TCP port to listen
timeout				= 3600				; Connection timeout in seconds

tcp_reuseport			= 1				; Activate SO_REUSEPORT

#rlimit_nofile			= 4096				; Max Open Files
max_clients			= 256				; Max Clients

io_buffer_tier_0               = 4294967295			; IO Buffers in tier 0 -   16 KB each, 0 for auto, unit32::MAX for 0
io_buffer_tier_1               = 256				; IO Buffers in tier 1 -   64 KB each, 0 for auto, unit32::MAX for 0
io_buffer_tier_2               = 4294967295			; IO Buffers in tier 2 -  256 KB each, 0 for auto, unit32::MAX for 0
io_buffer_tier_3               = 64				; IO Buffers in tier 3 -    1 MB each, 0 for auto, unit32::MAX for 0
io_buffer_tier_4               = 8				; IO Buffers in tier 4 -    4 MB each, 0 for auto, unit32::MAX for 0
io_buffer_tier_5               = 4294967295			; IO Buffers in tier 5 -   16 MB each, 0 for auto, unit32::MAX for 0
io_buffer_tier_6               = 4294967295			; IO Buffers in tier 6 -   64 MB each, 0 for auto, unit32::MAX for 0
io_buffer_tier_7               = 4294967295			; IO Buffers in tier 7 - ~257 MB each, 0 for auto, unit32::MAX for 0

max_memlist_arena		= 1024				; Max size of memlist AllocatorArena in MB.
;max_memlist_arena		= 8192				; Max size of memlist AllocatorArena in MB.

hash_arena			= 128				; HashIndex buffer size, 0 = disabled
;hash_arena			= 512				; HashIndex buffer size, 0 = disabled

crontab_reload			= 60				; crontab - reload every XX seconds, 0 disabled, min 15 sec
crontab_table_maintainance	= 30				; crontab - table maintainance every XX seconds, 0 disabled, min 15 sec
crontab_server_info		= 15				; crontab - server info every XX seconds, 0 disabled, min 15 sec
crontab_io_buffer_info		= 15				; crontab - server IO Buffer info every XX seconds, 0 disabled, min 15 sec

log_level			= 5				; server log level start=0, fatal=1, err=2, warn=3, notice=4, debug=5
;log_level			= 3				; server log level start=0, fatal=1, err=2, warn=3, notice=4, debug=5

